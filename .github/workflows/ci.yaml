name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP Syntax & Composer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The plugin header's "Requires PHP". Linting on the floor rather than
          # on latest is what catches syntax the declared minimum cannot parse.
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-lock

      - name: Lint PHP syntax
        run: find . -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer, cs2pr

      - name: Install PHP_CodeSniffer + WordPress Coding Standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-progress \
            "squizlabs/php_codesniffer:^3.9" \
            "wp-coding-standards/wpcs:^3.0" \
            "phpcsstandards/phpcsutils:^1.0" \
            "phpcsstandards/phpcsextra:^1.2"
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Run PHPCS
        run: phpcs --standard=.phpcs.xml -q --report=checkstyle . | cs2pr

  js:
    name: JS/CSS Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # package-lock.json is an npm 11 lock: `npm ci` fails on Node 22 (npm 10.9)
      # with 41 "Missing ... from lock file" errors. .nvmrc is the source of
      # truth so CI and humans cannot drift apart on it.
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JS
        run: npm run lint:js

      - name: Lint CSS
        run: npm run lint:css

      - name: Build
        run: npm run build

      # build/ is committed so the plugin runs from a checkout and so the release
      # zip does not need a build step. That only holds if it stays in sync.
      - name: Fail if build output is stale
        run: |
          if ! git diff --quiet -- build; then
            echo "::error::build/ is out of date - run 'npm run build' and commit the result"
            git diff --stat -- build
            exit 1
          fi
